services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  redis-commander:
    image: rediscommander/redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"

  postgres:
    image: postgres:16
    container_name: gmap_postgres
    restart: always
    environment:
      POSTGRES_USER: gmap
      POSTGRES_PASSWORD: gmap
      POSTGRES_DB: gmap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4
    container_name: gmap_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmap.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  # sample vulnerble web apps for demo/testing
  dvwa:
    image: vulnerables/web-dvwa
    container_name: gmap_dvwa
    ports:
      - "127.0.0.2:8080:80"
    profiles: ["sample-vuln"]

  juice-shop:
    image: bkimminich/juice-shop
    container_name: gmap_juice_shop
    ports:
      - "127.0.0.3:3000:3000"
    profiles: ["sample-vuln"]

  mutillidae:
    image: citizenstig/nowasp
    container_name: gmap_mutillidae
    ports:
      - "127.0.0.4:8008:80"
    profiles: ["sample-vuln"]

volumes:
  pgdata:
  pgadmin_data:
